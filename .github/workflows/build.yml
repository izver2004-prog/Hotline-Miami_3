name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  GODOT_VERSION: "4.3"
  GODOT_CHANNEL: "stable"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -1)
          if [ -z "$ZIP" ]; then echo "ZIP-архив проекта не найден в репозитории"; exit 1; fi
          echo "Распаковка: $ZIP"
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/proj"
          GD=$(find "$RUNNER_TEMP/proj" -name project.godot | head -1)
          if [ -z "$GD" ]; then echo "project.godot не найден внутри ZIP"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$GD")" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/licenses"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d cmdtmp
          mv cmdtmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes | "$SM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null) || true
          "$SM" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          wget -q "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -O godot.zip
          wget -q "${BASE}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz" -O templates.tpz
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          mkdir -p "$TPL"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$TPL/"
          godot --version

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Configure Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"${ANDROID_HOME}\""
              echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
              echo "export/android/debug_keystore = \"${HOME}/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > "$HOME/.config/godot/$f"
          done

      - name: Import project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import || true

      - name: Export APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/HotlineMiamiRedux.apk

      - name: Verify APK exists
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f build/HotlineMiamiRedux.apk
          ls -lh build/HotlineMiamiRedux.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotlineMiamiRedux-apk
          path: ${{ env.PROJECT_DIR }}/build/HotlineMiamiRedux.apk
          if-no-files-found: error
